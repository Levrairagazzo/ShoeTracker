services:
  api:
    build:
      context: ./src/ShoeTracker.Api
    environment:
      - AllowedHosts=${ALLOWED_HOSTS:-*}
      - SeedAdminEmail=${SEED_ADMIN_EMAIL}
      - SeedAdminPassword=${SEED_ADMIN_PASSWORD}
      - Strava__ClientId=${STRAVA_CLIENT_ID:-}
      - Strava__ClientSecret=${STRAVA_CLIENT_SECRET:-}
      - Strava__RedirectUri=${STRAVA_REDIRECT_URI:-https://milesleft.run/api/strava/callback}
      # Key ring for the auth cookie and the encrypted Strava tokens; on the data
      # volume so it survives rebuilds (and is picked up by the backup service).
      - DataProtection__KeysPath=/data/keys
    volumes:
      - shoe-data:/data
    restart: unless-stopped

  client:
    build:
      context: ./client
    depends_on:
      - api
    restart: unless-stopped

  backup:
    build:
      context: ./backup
    environment:
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
    volumes:
      # Read-write on purpose: WAL-mode SQLite needs to touch its -wal/-shm
      # sidecar files even to read, so a read-only mount can't back it up.
      - shoe-data:/data
      - ./backups:/backups
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client
    restart: unless-stopped

volumes:
  shoe-data:
  caddy-data:
  caddy-config:
