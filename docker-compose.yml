services:
  api:
    build:
      context: ./src/ShoeTracker.Api
    environment:
      - AllowedHosts=${ALLOWED_HOSTS:-*}
      - SeedAdminEmail=${SEED_ADMIN_EMAIL}
      - SeedAdminPassword=${SEED_ADMIN_PASSWORD}
    volumes:
      - shoe-data:/data
    restart: unless-stopped

  client:
    build:
      context: ./client
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client
    restart: unless-stopped

volumes:
  shoe-data:
  caddy-data:
  caddy-config:
